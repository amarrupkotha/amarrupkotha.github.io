<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রূপকথার চেম্বার ❤️</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background:
    radial-gradient(ellipse at 15% 20%,
      rgba(255, 221, 239, 0.9), transparent 45%),
    radial-gradient(ellipse at 85% 80%,
      rgba(255, 231, 180, 0.8), transparent 45%),
    linear-gradient(135deg, #fff8ee, #f8eaff, #fff5e6);
}

/* Dreamy little stars */
body::before {
  content: "✦     ✧        ⋆       ✧\A"
           "    ⋆       ✦       ⋆\A"
           "✧       ⋆       ✧       ✦\A"
           "    ✦       ✧        ⋆";
  white-space: pre;
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 3.5;
  letter-spacing: 14px;
  font-size: 17px;
  color: #d8a8cf;
  opacity: 0.65;
  pointer-events: none;
}

.scene {
  width: 100vw;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

.scene img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}
</style>
</head>

<body>
  <main class="scene">
    <img
      src="assets/chamber/chamber-scene.png"
      alt="রূপকথার চেম্বার"
    >
  </main>
</body>
</html>
