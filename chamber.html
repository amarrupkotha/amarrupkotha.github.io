<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dr. Rupkotha's Chamber</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
}

body {
  overflow-x: hidden;
  background: #f8e9dc;
}

.chamber {
  position: relative;
  width: 100%;
  min-height: 180vh;
  background-image: url("assets/chamber/clinic-bg.jpg");
  background-size: 100% 100%;
  background-position: top center;
  background-repeat: no-repeat;
  overflow: hidden;
}

.person {
  position: absolute;
  display: block;
  height: auto;
  object-fit: contain;
  animation: float 4s ease-in-out infinite;
  filter: drop-shadow(0 7px 6px #49372a24);
}

.doctor {
  width: 38%;
  max-width: 330px;
  top: 8%;
  left: 31%;
  animation-delay: -.8s;
}

.child {
  width: 30%;
  max-width: 250px;
}

.c1 {
  top: 25%;
  left: 2%;
  animation-delay: -.5s;
}

.c2 {
  top: 30%;
  right: 2%;
  animation-delay: -2s;
}

.c3 {
  top: 48%;
  left: 4%;
  animation-delay: -1.5s;
}

.c4 {
  top: 51%;
  right: 3%;
  animation-delay: -3s;
}

.c5 {
  top: 68%;
  left: 8%;
  animation-delay: -2.5s;
}

.c6 {
  top: 72%;
  right: 7%;
  animation-delay: -1s;
}

@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

@media (min-width: 700px) {
  .chamber {
    min-height: 170vh;
  }

  .doctor {
    width: 25%;
    left: 37.5%;
  }

  .child {
    width: 20%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .person {
    animation: none;
  }
}
</style>
</head>

<body>
<main class="chamber">

  <img class="person doctor"
       src="assets/chamber/rupkotha.png" alt="">

  <img class="person child c1"
       src="assets/chamber/child-1.png" alt="">

  <img class="person child c2"
       src="assets/chamber/child-2.png" alt="">

  <img class="person child c3"
       src="assets/chamber/child-3.png" alt="">

  <img class="person child c4"
       src="assets/chamber/child-4.png" alt="">

  <img class="person child c5"
       src="assets/chamber/child-5.png" alt="">

  <img class="person child c6"
       src="assets/chamber/child-6.png" alt="">

</main>
</body>
</html>
