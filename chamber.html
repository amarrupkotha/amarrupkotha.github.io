<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রূপকথার চেম্বার ❤️</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f6eee7;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

.scene {
  width: 100vw;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.scene img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}

/* Landscape phone */
@media (orientation: landscape) {
  .scene img {
    width: 100vw;
    height: 100dvh;
    object-fit: contain;
  }
}
</style>
</head>

<body>
  <main class="scene">
    <img
      src="assets/chamber/chamber-scene.png"
      alt="রূপকথার চেম্বার"
    >
  </main>
</body>
</html>
