<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rupkotha's Clinic</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f4eee7;
}

.stage {
  width: 100%;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.clinic {
  position: relative;
  width: min(100vw, 177.7778vh);
  aspect-ratio: 16 / 9;
  flex: none;
  background-image: url("assets/chamber/clinic-bg.jpg");
  background-size: 100% 100%;
  background-repeat: no-repeat;
  background-position: center;
  overflow: hidden;
}

.person {
  position: absolute;
  display: block;
  height: auto;
  object-fit: contain;
}

/* রূপকথা */
.rupkotha {
  width: 22%;
  left: 39%;
  bottom: 5%;
  z-index: 2;
}

/* সব বাচ্চার পায়ের অবস্থান একই ফ্লোরে */
.child {
  width: 13%;
  bottom: 4%;
  z-index: 3;
}

.c1 { left: 1%; }
.c2 { left: 16%; }
.c3 { left: 31%; }
.c4 { left: 56%; }
.c5 { left: 71%; }
.c6 { left: 86%; }

/* ছোট স্ক্রিনে ছবিগুলো যেন দৃশ্যের ভেতরে থাকে */
@media (max-aspect-ratio: 4/5) {
  .clinic {
    width: 100vw;
  }

  .rupkotha {
    width: 24%;
    left: 38%;
  }

  .child {
    width: 14%;
  }
}
</style>
</head>

<body>
<div class="stage">
  <main class="clinic">

    <img class="person rupkotha"
         src="assets/chamber/rupkotha.png" alt="">

    <img class="person child c1"
         src="assets/chamber/child-1.png" alt="">

    <img class="person child c2"
         src="assets/chamber/child-2.png" alt="">

    <img class="person child c3"
         src="assets/chamber/child-3.png" alt="">

    <img class="person child c4"
         src="assets/chamber/child-4.png" alt="">

    <img class="person child c5"
         src="assets/chamber/child-5.png" alt="">

    <img class="person child c6"
         src="assets/chamber/child-6.png" alt="">

  </main>
</div>
</body>
</html>
