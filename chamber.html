<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rupkotha's Clinic</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}


.clinic {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  height: auto;
  max-height: 100dvh;
  margin: auto;
  background-image: url("assets/chamber/clinic-bg.jpg");
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
}


img {
  position: absolute;
  height: auto;
  object-fit: contain;
}

.rupkotha {
  width: 35%;
  max-height: 65%;
  left: 32.5%;
  bottom: 8%;
}

.child {
  width: 21%;
  max-height: 35%;
}

.c1 { left: 1%; top: 8%; }
.c2 { right: 1%; top: 8%; }
.c3 { left: 2%; top: 38%; }
.c4 { right: 2%; top: 38%; }
.c5 { left: 12%; bottom: 3%; }
.c6 { right: 12%; bottom: 3%; }

@media (min-width: 700px) {
  .rupkotha {
    width: 25%;
    left: 37.5%;
  }

  .child {
    width: 15%;
  }
}
</style>
</head>

<body>
<div class="clinic">
  <img class="rupkotha" src="assets/chamber/rupkotha.png" alt="">

  <img class="child c1" src="assets/chamber/child-1.png" alt="">
  <img class="child c2" src="assets/chamber/child-2.png" alt="">
  <img class="child c3" src="assets/chamber/child-3.png" alt="">
  <img class="child c4" src="assets/chamber/child-4.png" alt="">
  <img class="child c5" src="assets/chamber/child-5.png" alt="">
  <img class="child c6" src="assets/chamber/child-6.png" alt="">
</div>
</body>
</html>
