<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Rupkotha's Chamber 🌸</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --pink: #f6a1c6;
  --purple: #a17bd2;
  --ink: #684e70;
}

body {
  margin: 0;
  color: var(--ink);
  font-family: "Noto Sans Bengali", "Hind Siliguri",
               system-ui, sans-serif;
  background: #fff7f8;
}

.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  background: #fffdf4eF;
  box-shadow: 0 3px 18px #77517715;
}

.brand {
  color: #a24f8b;
  font-size: clamp(16px, 3vw, 23px);
  font-weight: 900;
}

.home-link {
  padding: 9px 14px;
  color: #80528e;
  background: white;
  border: 1px solid #ecd4e9;
  border-radius: 25px;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
}

.chamber {
  min-height: 100vh;
  overflow: hidden;
  background:
    linear-gradient(#fff7f8a8, #fff4f6b8),
    url("assets/chamber/clinic-bg.jpg") center center / cover no-repeat,
    #e7f4ee;
}

.heading {
  position: relative;
  z-index: 4;
  padding: 22px 12px 0;
  text-align: center;
}

.heading h1 {
  margin: 0;
  color: #a35191;
  font-size: clamp(27px, 5.5vw, 48px);
  text-shadow: 0 2px 0 white;
}

.heading p {
  margin: 8px auto;
  font-size: clamp(14px, 2.5vw, 18px);
  line-height: 1.8;
}

.playroom {
  position: relative;
  isolation: isolate;
  width: 100%;
  max-width: 1100px;
  height: clamp(490px, 72vw, 670px);
  margin: 0 auto;
}

/* Rupkotha — the main character */
.doctor {
  position: absolute;
  z-index: 3;
  width: clamp(230px, 36vw, 350px);
  height: 86%;
  left: 50%;
  bottom: 0;
  object-fit: contain;
  object-position: center bottom;
  transform: translateX(-50%);
  transform-origin: center bottom;
  filter: drop-shadow(0 9px 8px #70506c25);
  animation: doctorSway 4s ease-in-out infinite;
}

/* Six children gathered around Rupkotha */
.child {
  position: absolute;
  z-index: 4;
  bottom: 1%;
  width: clamp(125px, 20vw, 195px);
  height: 44%;
  object-fit: contain;
  object-position: center bottom;
  transform-origin: center bottom;
  filter: drop-shadow(0 5px 5px #70506c20);
  animation: childPlay 2.5s ease-in-out infinite;
}

.child-1 {
  left: 0%;
  bottom: 1%;
  animation-delay: -.4s;
}

.child-2 {
  left: 13%;
  bottom: 16%;
  animation-delay: -1.2s;
}

.child-3 {
  left: 27%;
  bottom: 0%;
  animation-delay: -.8s;
}

.child-4 {
  right: 27%;
  bottom: 0%;
  animation-delay: -1.5s;
}

.child-5 {
  right: 13%;
  bottom: 16%;
  animation-delay: -.6s;
}

.child-6 {
  right: 0%;
  bottom: 1%;
  animation-delay: -1.8s;
}

/* Floating decorations */
.magic {
  position: absolute;
  z-index: 5;
  pointer-events: none;
  font-size: clamp(22px, 4vw, 36px);
  animation: sparkleFloat 5s ease-in-out infinite;
}

.magic-1 { top: 9%; left: 9%; }
.magic-2 { top: 22%; left: 35%; animation-delay: -2s; }
.magic-3 { top: 11%; right: 9%; animation-delay: -1s; }
.magic-4 { top: 34%; right: 29%; animation-delay: -3s; }
.magic-5 { top: 32%; left: 23%; animation-delay: -1.5s; }

.welcome {
  position: relative;
  z-index: 6;
  width: fit-content;
  max-width: calc(100% - 28px);
  margin: 0 auto 20px;
  padding: 13px 22px;
  text-align: center;
  line-height: 1.9;
  background: #ffffffed;
  border: 2px solid white;
  border-radius: 24px;
  box-shadow: 0 7px 28px #a17bd225;
}

.welcome strong {
  color: #b45598;
}

.footer {
  padding: 16px;
  text-align: center;
  color: #8d7190;
  font-size: 13px;
}

/* Animations */
@keyframes doctorSway {
  0%, 100% {
    transform: translateX(-50%) translateY(0) rotate(0);
  }
  50% {
    transform: translateX(-50%) translateY(-8px) rotate(1deg);
  }
}

@keyframes childPlay {
  0%, 100% {
    translate: 0 0;
    rotate: 0deg;
  }
  35% {
    translate: 0 -10px;
    rotate: -2deg;
  }
  70% {
    translate: 0 -3px;
    rotate: 2deg;
  }
}

@keyframes sparkleFloat {
  0%, 100% {
    translate: 0 0;
    rotate: -8deg;
  }
  50% {
    translate: 9px -18px;
    rotate: 10deg;
  }
}

/* Mobile layout */
@media (max-width: 520px) {
  .topbar {
    padding: 12px;
  }

  .home-link {
    padding: 8px 10px;
    font-size: 12px;
  }

  .playroom {
    height: 490px;
  }

  .doctor {
    width: 205px;
    height: 74%;
    bottom: 4%;
  }

  .child {
    width: 112px;
    height: 35%;
  }

  .child-1 {
    left: -3%;
    bottom: 0;
  }

  .child-2 {
    left: 5%;
    bottom: 18%;
  }

  .child-3 {
    left: 20%;
    bottom: 0;
  }

  .child-4 {
    right: 20%;
    bottom: 0;
  }

  .child-5 {
    right: 5%;
    bottom: 18%;
  }

  .child-6 {
    right: -3%;
    bottom: 0;
  }

  .welcome {
    padding: 11px 14px;
    font-size: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
  }
}
  
/* Make the doctor and children much larger */
.playroom {
  height: 780px !important;
  overflow: visible !important;
}

.doctor {
  width: 460px !important;
  max-width: 75vw !important;
  height: auto !important;
  z-index: 5 !important;
}

.child {
  width: 260px !important;
  max-width: 44vw !important;
  height: auto !important;
  object-fit: contain !important;
}

.child-1 { left: 0 !important; top: 5% !important; }
.child-2 { right: 0 !important; top: 5% !important; }
.child-3 { left: 0 !important; top: 40% !important; }
.child-4 { right: 0 !important; top: 40% !important; }
.child-5 { left: 12% !important; bottom: 0 !important; }
.child-6 { right: 12% !important; bottom: 0 !important; }

@media (max-width: 600px) {
  .playroom {
    height: 680px !important;
  }

  .doctor {
    width: 300px !important;
    max-width: 82vw !important;
  }

  .child {
    width: 155px !important;
    max-width: 43vw !important;
  }

  .child-1 { left: 0 !important; top: 4% !important; }
  .child-2 { right: 0 !important; top: 4% !important; }
  .child-3 { left: 0 !important; top: 35% !important; }
  .child-4 { right: 0 !important; top: 35% !important; }
  .child-5 { left: 0 !important; bottom: 0 !important; }
  .child-6 { right: 0 !important; bottom: 0 !important; }
}
</style>
</head>

<body>
<div class="chamber">

  <header class="topbar">
    <div class="brand">🩺 Dr. Rupkotha</div>
    <a class="home-link" href="index.html">← মূল পেজে ফিরি</a>
  </header>

  <section class="heading">
    <h1>Dr. Rupkotha's Chamber 🌸</h1>
    <p>ছোট্ট সোনামণিদের হাসি, খেলা আর ভালোবাসার জগৎ! 🧸</p>
  </section>

  <main class="playroom">

    <span class="magic magic-1" aria-hidden="true">🦋</span>
    <span class="magic magic-2" aria-hidden="true">✨</span>
    <span class="magic magic-3" aria-hidden="true">🌟</span>
    <span class="magic magic-4" aria-hidden="true">💖</span>
    <span class="magic magic-5" aria-hidden="true">🎈</span>

    <img class="child child-1"
      src="assets/chamber/child-1.png" alt="খেলতে থাকা শিশু">

    <img class="child child-2"
      src="assets/chamber/child-2.png" alt="আনন্দিত শিশু">

    <img class="child child-3"
      src="assets/chamber/child-3.png" alt="হাসিখুশি শিশু">

    <img class="child child-4"
      src="assets/chamber/child-4.png" alt="খেলতে থাকা শিশু">

    <img class="child child-5"
      src="assets/chamber/child-5.png" alt="আনন্দিত শিশু">

    <img class="child child-6"
      src="assets/chamber/child-6.png" alt="হাসিখুশি শিশু">

    <img class="doctor"
      src="assets/chamber/rupkotha.png" alt="Dr. Rupkotha">

  </main>

  <section class="welcome">
    <strong>রূপকথার চেম্বারে স্বাগতম! 💗</strong><br>
    এখানে ছোট্ট হাসিগুলোই সবচেয়ে বড় উপহার।
  </section>

  <footer class="footer">
    Made with love for Rupkotha 🌷
  </footer>

</div>
</body>
</html>
